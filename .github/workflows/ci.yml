name: CI

# Windows and Linux: these decide whether a change is good. macOS is checked separately (ci-macos.yml)
# so that its scarce, slow runners can never hold up or redden this run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]   # 22.04: "latest" Ubuntu no longer ships Python 3.9
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no network, no dependencies)
        run: python -m unittest discover -s tests -t . -v
