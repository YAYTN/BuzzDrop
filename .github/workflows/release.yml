name: Release

# Push a tag like v1.0.0 → builds Windows, macOS and Linux apps and attaches
# them to a GitHub Release. The in-app update checker reads that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BuzzDrop-windows-x64.exe
          - os: macos-latest
            asset: BuzzDrop-macos-apple-silicon.zip
          - os: ubuntu-22.04          # older glibc → runs on more distros
            asset: BuzzDrop-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk8.6 libtk8.6
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: |
          python -m pip install pyinstaller==6.11.1
          python packaging/build.py --asset-name ${{ matrix.asset }}
      - name: Smoke test
        if: runner.os != 'macOS'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.asset }} || true
          ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (the in-app updater verifies downloads against this file)
        run: cd artifacts && sha256sum * > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
