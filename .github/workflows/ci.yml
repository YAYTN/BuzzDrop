name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]   # 22.04: "latest" Ubuntu no longer ships Python 3.9
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"   # no Apple-silicon build of 3.9 on GitHub runners
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no network, no dependencies)
        run: python -m unittest discover -s tests -t . -v
